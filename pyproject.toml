[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lume-ai"
dynamic = ["version"]
description = "A small, beautiful, dependency-free terminal chat client for Claude, GPT and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bobby-tablez", email = "bobby-tablez@users.noreply.github.com" }]
keywords = ["claude", "anthropic", "openai", "gpt", "gemini", "llm", "chat", "cli", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
# Zero runtime dependencies, on purpose. The standard library is the dependency.
dependencies = []

[project.scripts]
lume = "lume.cli:main"

[project.urls]
Homepage = "https://github.com/bobby-tablez/lume-ai"
Repository = "https://github.com/bobby-tablez/lume-ai"
Issues = "https://github.com/bobby-tablez/lume-ai/issues"
Changelog = "https://github.com/bobby-tablez/lume-ai/releases"

[tool.hatch.version]
path = "lume/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lume"]

[tool.hatch.build.targets.sdist]
include = ["lume", "tests", "lume-cli", "README.md", "LICENSE", "SPEC.md", "pyproject.toml"]
