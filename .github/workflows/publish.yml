name: publish

# Trusted publishing: PyPI verifies this workflow's identity through OIDC, so
# there is no API token to store, rotate or leak. The identity is the exact
# tuple registered on PyPI -- owner, repository, *this filename*, and the
# environment named below -- so renaming this file breaks publishing until the
# publisher on PyPI is updated to match.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # Fails the run before anything is uploaded if the README will not render
      # on the project page -- which cannot be fixed after the fact, because a
      # version number can never be reused.
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write            # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
